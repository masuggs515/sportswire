name: sportswire
description: SportsWire — personalised NBA & NFL news feed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.0.0

  # State management
  flutter_riverpod: ^2.0.0

  # Navigation
  go_router: ^13.0.0

  # Analytics
  mixpanel_flutter: ^2.3.0

  # Storage
  shared_preferences: ^2.0.0

  # Images
  cached_network_image: ^3.0.0

  # Date formatting
  intl: ^0.19.0

  # Loading skeletons
  shimmer: ^3.0.0

  # External links
  url_launcher: ^6.3.0

  # Share sheet
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true